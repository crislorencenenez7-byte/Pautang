<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Login | PautangMo</title><link rel="stylesheet" href="style.css"></head>
<body><main class="auth-shell"><section class="auth-card">
<a class="brand" href="index.html">₱ PautangMo</a><p class="eyebrow">ADMIN ACCESS</p><h1>Sign in to Admin</h1><p>Authorized administrators only.</p>
<form id="adminLoginForm"><label>Email<input id="adminEmail" type="email" autocomplete="username" required placeholder="admin@email.com"></label>
<label>Password<input id="adminPassword" type="password" autocomplete="current-password" required placeholder="Password"></label>
<button class="primary-btn" type="submit">Sign in →</button><div id="adminLoginMessage" class="message" hidden></div></form>
<a href="index.html">← Back to website</a></section></main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
const firebaseConfig = window.PAUTANG_FIREBASE_CONFIG || {};
const form=document.getElementById("adminLoginForm"), msg=document.getElementById("adminLoginMessage");
form.addEventListener("submit",async e=>{e.preventDefault();msg.hidden=true;
try{const app=initializeApp(firebaseConfig);const auth=getAuth(app);await signInWithEmailAndPassword(auth,adminEmail.value,adminPassword.value);location.href="admin.html";}
catch(err){msg.textContent=err.message||"Login failed.";msg.className="message error";msg.hidden=false;}});
</script>
<script src="firebase-config.js"></script></body></html>
