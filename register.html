<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >
  <title>Register | PautangMo</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="auth-shell">
    <section class="auth-card">
      <a class="brand" href="index.html">₱ PautangMo</a>

      <p class="eyebrow">CREATE ACCOUNT</p>

      <h1>Join PautangMo</h1>

      <p>
        Create your client account.
        Every new registration starts as a client.
      </p>

      <form id="registerForm">
        <label for="name">
          Full Name
          <input
            id="name"
            type="text"
            autocomplete="name"
            required
            placeholder="Your full name"
          >
        </label>

        <label for="email">
          Email
          <input
            id="email"
            type="email"
            autocomplete="email"
            required
            placeholder="you@example.com"
          >
        </label>

        <label for="password">
          Password
          <input
            id="password"
            type="password"
            autocomplete="new-password"
            minlength="6"
            required
            placeholder="At least 6 characters"
          >
        </label>

        <label for="confirmPassword">
          Confirm Password
          <input
            id="confirmPassword"
            type="password"
            autocomplete="new-password"
            minlength="6"
            required
            placeholder="Repeat password"
          >
        </label>

        <button
          class="primary-btn"
          id="registerButton"
          type="submit"
        >
          Create account →
        </button>

        <div
          id="message"
          class="message"
          hidden
        ></div>
      </form>

      <a href="login.html">
        Already have an account? Sign in →
      </a>

      <br>

      <a href="index.html">
        ← Back to website
      </a>
    </section>
  </main>

  <script src="firebase-config.js"></script>

  <script type="module">
    import {
      auth,
      db,
      createUserWithEmailAndPassword,
      sendEmailVerification,
      updateProfile
    } from "./auth.js";

    import {
      doc,
      setDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

    const form = document.getElementById("registerForm");
    const msg = document.getElementById("message");
    const btn = document.getElementById("registerButton");

    function show(text, error = false) {
      msg.textContent = text;
      msg.className = error
        ? "message error"
        : "message";
      msg.hidden = false;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      msg.hidden = true;

      const name =
        document.getElementById("name").value.trim();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (!name) {
        show("Please enter your full name.", true);
        return;
      }

      if (password !== confirmPassword) {
        show("Passwords do not match.", true);
        return;
      }

      if (password.length < 6) {
        show(
          "Password must be at least 6 characters.",
          true
        );
        return;
      }

      btn.disabled = true;
      btn.textContent = "Creating account...";

      try {
        const credential =
          await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );

        const user = credential.user;

        await updateProfile(user, {
          displayName: name
        });

        /*
         * Every newly registered account
         * starts as CLIENT.
         */

        await setDoc(
          doc(db, "users", user.uid),
          {
            name: name,
            email: user.email,
            role: "client",
            createdAt: serverTimestamp()
          }
        );

        /*
         * Firebase sends the verification email.
         */

        await sendEmailVerification(user);

        show(
          "Account created! Check your email " +
          "and verify your account."
        );

        form.reset();

      } catch (error) {
        console.error(
          "Registration error:",
          error
        );

        let text = "Registration failed.";

        if (
          error.code ===
          "auth/email-already-in-use"
        ) {
          text = "This email is already registered.";
        } else if (
          error.code ===
          "auth/invalid-email"
        ) {
          text = "Invalid email address.";
        } else if (
          error.code ===
          "auth/weak-password"
        ) {
          text =
            "Password must be at least 6 characters.";
        } else if (
          error.code === "permission-denied"
        ) {
          text =
            "Firestore permission denied. " +
            "Publish the Firestore rules.";
        } else if (error.message) {
          text = error.message;
        }

        show(text, true);

      } finally {
        btn.disabled = false;
        btn.textContent = "Create account →";
      }
    });
  </script>
</body>
</html>
