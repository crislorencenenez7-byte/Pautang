<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register | PautangMo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card">
      <a class="brand" href="index.html">₱ PautangMo</a>
      <p class="eyebrow">CREATE ACCOUNT</p>
      <h1>Join PautangMo</h1>
      <p>Create your client account. Every new registration starts as a client.</p>

      <form id="registerForm">
        <label>
          Full Name
          <input id="name" type="text" autocomplete="name" required placeholder="Your full name">
        </label>

        <label>
          Email
          <input id="email" type="email" autocomplete="email" required placeholder="you@example.com">
        </label>

        <label>
          Password
          <input id="password" type="password" autocomplete="new-password" minlength="6" required placeholder="At least 6 characters">
        </label>

        <label>
          Confirm Password
          <input id="confirmPassword" type="password" autocomplete="new-password" minlength="6" required placeholder="Repeat password">
        </label>

        <button class="primary-btn" id="registerButton" type="submit">Create account →</button>
        <div id="message" class="message" hidden></div>
      </form>

      <a href="login.html">Already have an account? Sign in →</a><br>
      <a href="index.html">← Back to website</a>
    </section>
  </main>

  <script src="firebase-config.js"></script>
  <script type="module">
    import {
      auth,
      db,
      createUserWithEmailAndPassword,
      sendEmailVerification,
      updateProfile
    } from "./auth.js";
    import {
      doc,
      setDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

    const form = document.getElementById("registerForm");
    const message = document.getElementById("message");
    const registerButton = document.getElementById("registerButton");

    function showMessage(text, isError = false) {
      message.textContent = text;
      message.className = isError ? "message error" : "message";
      message.hidden = false;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.hidden = true;

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (!name) {
        showMessage("Please enter your full name.", true);
        return;
      }

      if (password !== confirmPassword) {
        showMessage("Passwords do not match.", true);
        return;
      }

      if (password.length < 6) {
        showMessage("Password must be at least 6 characters.", true);
        return;
      }

      registerButton.disabled = true;
      registerButton.textContent = "Creating account...";

      try {
        const credential = await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );

        const user = credential.user;

        await updateProfile(user, {
          displayName: name
        });

        // Every newly registered user is a client.
        await setDoc(doc(db, "users", user.uid), {
          name,
          email: user.email,
          role: "client",
          createdAt: serverTimestamp()
        });

        // Send verification only once during registration.
        await sendEmailVerification(user);

        showMessage(
          "Account created! Check your email and verify your account."
        );
        form.reset();
      } catch (error) {
        console.error(error);

        const errorMessage =
          error.code === "auth/email-already-in-use"
            ? "This email is already registered. Please use Login instead."
            : error.code === "auth/invalid-email"
              ? "Invalid email address."
              : error.code === "auth/weak-password"
                ? "Password must be at least 6 characters."
                : error.code === "permission-denied"
                  ? "Firestore permission denied. Publish the Firestore rules."
                  : error.message || "Registration failed.";

        showMessage(errorMessage, true);
      } finally {
        registerButton.disabled = false;
        registerButton.textContent = "Create account →";
      }
    });
  </script>
</body>
</html>
