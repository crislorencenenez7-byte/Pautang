<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register | PautangMo</title><link rel="stylesheet" href="style.css"><script src="firebase-config.js"></script></head>
<body><main class="auth-shell"><section class="auth-card">
<a class="brand" href="index.html">₱ PautangMo</a><p class="eyebrow">CREATE ACCOUNT</p><h1>Register.</h1><p>Create your borrower account before applying for a loan.</p>
<form id="registerForm"><label>Full name<input id="name" type="text" autocomplete="name" required placeholder="Your full name"></label><label>Email<input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></label><label>Password<input id="password" type="password" autocomplete="new-password" minlength="6" required placeholder="At least 6 characters"></label><label>Confirm password<input id="confirmPassword" type="password" autocomplete="new-password" minlength="6" required placeholder="Repeat your password"></label><button class="primary-btn" type="submit">Create Account →</button><div id="message" class="message" hidden></div></form>
<p class="auth-switch">Already have an account? <a href="login.html">Login</a></p><a href="index.html">← Back to website</a>
</section></main>
<script type="module">import {auth,createUserWithEmailAndPassword,sendEmailVerification,updateProfile} from './auth.js';
const form=document.getElementById('registerForm'),msg=document.getElementById('message');
form.addEventListener('submit',async e=>{e.preventDefault();msg.hidden=true;const name=document.getElementById('name').value.trim(),email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,confirm=document.getElementById('confirmPassword').value;if(password!==confirm){msg.textContent='Passwords do not match.';msg.className='message error';msg.hidden=false;return;}try{const c=await createUserWithEmailAndPassword(auth,email,password);await updateProfile(c.user,{displayName:name});await sendEmailVerification(c.user);msg.textContent='Account created. Check your email and verify your account before logging in.';msg.className='message';msg.hidden=false;form.reset();}catch(err){msg.textContent=err.code==='auth/email-already-in-use'?'That email is already registered.':(err.message||'Registration failed.');msg.className='message error';msg.hidden=false;}});</script></body></html>
