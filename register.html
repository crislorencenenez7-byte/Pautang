<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account - PautangMo</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .auth-container {
      max-width: 450px;
      margin: 40px auto;
      padding: 25px;
    }

    .auth-card {
      background: #fff;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .auth-card h1 {
      margin-bottom: 8px;
    }

    .auth-card p {
      color: #666;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .form-group input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    .form-group input:focus {
      border-color: #2563eb;
    }

    .register-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .register-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.success {
      display: block;
      background: #e8f7ee;
      color: #166534;
    }

    .message.error {
      display: block;
      background: #feecec;
      color: #991b1b;
    }

    .login-link {
      text-align: center;
      margin-top: 18px;
    }

    .login-link a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }

    .debug-box {
      display: none;
      margin-top: 15px;
      padding: 12px;
      background: #111827;
      color: #f9fafb;
      border-radius: 10px;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <div class="auth-container">

    <div class="auth-card">

      <h1>Create Account</h1>

      <p>
        Create your PautangMo account to continue.
      </p>

      <form id="registerForm">

        <div class="form-group">
          <label for="name">Full Name</label>

          <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your full name"
            required
            autocomplete="name"
          >
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            required
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>

          <input
            type="password"
            id="password"
            name="password"
            placeholder="Create a password"
            required
            minlength="6"
            autocomplete="new-password"
          >
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>

          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            placeholder="Confirm your password"
            required
            minlength="6"
            autocomplete="new-password"
          >
        </div>

        <button
          type="submit"
          id="registerBtn"
          class="register-btn"
        >
          Create Account
        </button>

      </form>

      <div id="message" class="message"></div>

      <div id="debugBox" class="debug-box"></div>

      <div class="login-link">
        Already have an account?
        <a href="login.html">Login</a>
      </div>

    </div>

  </div>

  <script type="module">

    import {
      createUserWithEmailAndPassword,
      sendEmailVerification,
      updateProfile
    } from "./auth.js";

    const form = document.getElementById("registerForm");
    const registerBtn = document.getElementById("registerBtn");
    const message = document.getElementById("message");
    const debugBox = document.getElementById("debugBox");

    function showMessage(text, type) {

      message.textContent = text;

      message.className = "message " + type;
    }

    function showDebug(text) {

      debugBox.textContent = text;

      debugBox.style.display = "block";
    }

    function hideDebug() {

      debugBox.textContent = "";

      debugBox.style.display = "none";
    }

    function withTimeout(promise, milliseconds, timeoutMessage) {

      const timeout = new Promise((_, reject) => {

        setTimeout(() => {

          reject(new Error(timeoutMessage));

        }, milliseconds);

      });

      return Promise.race([
        promise,
        timeout
      ]);
    }

    form.addEventListener("submit", async (event) => {

      event.preventDefault();

      hideDebug();

      const name =
        document.getElementById("name").value.trim();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;


      if (!name) {

        showMessage(
          "Please enter your full name.",
          "error"
        );

        return;
      }


      if (!email) {

        showMessage(
          "Please enter your email address.",
          "error"
        );

        return;
      }


      if (password.length < 6) {

        showMessage(
          "Password must contain at least 6 characters.",
          "error"
        );

        return;
      }


      if (password !== confirmPassword) {

        showMessage(
          "Passwords do not match.",
          "error"
        );

        return;
      }


      registerBtn.disabled = true;

      registerBtn.textContent = "Creating account...";


      try {

        /*
         * STEP 1
         * Create Firebase Authentication account.
         */

        const credential =
          await createUserWithEmailAndPassword(
            email,
            password
          );

        const user = credential.user;


        /*
         * STEP 2
         * Update Firebase display name.
         */

        try {

          await updateProfile(user, {
            displayName: name
          });

        } catch (profileError) {

          console.warn(
            "Display name update failed:",
            profileError
          );

        }


        /*
         * STEP 3
         * SEND FIREBASE VERIFICATION EMAIL
         *
         * This is the important part we're debugging.
         */

        registerBtn.textContent =
          "Sending verification email...";


        try {

          await withTimeout(
            sendEmailVerification(user),
            15000,
            "Firebase verification email request timed out."
          );


          console.log(
            "Firebase verification email sent successfully."
          );


          showMessage(
            "Account created successfully!\n\n" +
            "A verification email has been sent to:\n" +
            email +
            "\n\n" +
            "Please check your Inbox and Spam/Junk folder before logging in.",
            "success"
          );


          /*
           * Disable form after successful registration.
           */

          form.reset();

          registerBtn.disabled = true;

          registerBtn.textContent =
            "Verification Email Sent";


        } catch (verificationError) {

          /*
           * THIS SHOWS THE ACTUAL FIREBASE ERROR.
           */

          console.error(
            "FIREBASE VERIFICATION ERROR:",
            verificationError
          );


          const errorCode =
            verificationError?.code ||
            "unknown";

          const errorMessage =
            verificationError?.message ||
            verificationError?.toString() ||
            "Unknown Firebase error";


          showMessage(
            "Your account was created, but Firebase could not send the verification email.\n\n" +
            "Do NOT create another account yet.\n\n" +
            "Check the error information below.",
            "error"
          );


          showDebug(
            "FIREBASE VERIFICATION ERROR\n\n" +
            "Code:\n" +
            errorCode +
            "\n\n" +
            "Message:\n" +
            errorMessage
          );


          registerBtn.disabled = false;

          registerBtn.textContent =
            "Try Verification Again";


          /*
           * Try to send again when the button is clicked.
           * The account already exists, so we don't create
           * another Firebase account.
           */

          registerBtn.onclick = async () => {

            registerBtn.disabled = true;

            registerBtn.textContent =
              "Sending verification...";

            hideDebug();

            try {

              await withTimeout(
                sendEmailVerification(user),
                15000,
                "Firebase verification email request timed out."
              );


              showMessage(
                "Verification email sent successfully.\n\n" +
                "Check your Inbox and Spam/Junk folder.",
                "success"
              );


              showDebug(
                "Firebase accepted the verification email request successfully."
              );


              registerBtn.textContent =
                "Verification Email Sent";


            } catch (retryError) {

              console.error(
                "FIREBASE VERIFICATION RETRY ERROR:",
                retryError
              );


              const retryCode =
                retryError?.code ||
                "unknown";

              const retryMessage =
                retryError?.message ||
                retryError?.toString() ||
                "Unknown Firebase error";


              showMessage(
                "Firebase still could not send the verification email.",
                "error"
              );


              showDebug(
                "FIREBASE VERIFICATION RETRY ERROR\n\n" +
                "Code:\n" +
                retryCode +
                "\n\n" +
                "Message:\n" +
                retryMessage
              );


              registerBtn.disabled = false;

              registerBtn.textContent =
                "Try Verification Again";
            }

          };

        }


      } catch (error) {

        /*
         * Registration itself failed.
         */

        console.error(
          "FIREBASE REGISTRATION ERROR:",
          error
        );


        const errorCode =
          error?.code ||
          "unknown";

        const errorMessage =
          error?.message ||
          error?.toString() ||
          "Unknown Firebase error";


        let friendlyMessage =
          "Registration failed.";


        if (
          errorCode ===
          "auth/email-already-in-use"
        ) {

          friendlyMessage =
            "This email is already registered. Try logging in instead.";

        } else if (
          errorCode ===
          "auth/invalid-email"
        ) {

          friendlyMessage =
            "The email address is invalid.";

        } else if (
          errorCode ===
          "auth/weak-password"
        ) {

          friendlyMessage =
            "The password is too weak. Use at least 6 characters.";

        } else if (
          errorCode ===
          "auth/operation-not-allowed"
        ) {

          friendlyMessage =
            "Email/password authentication is not enabled in Firebase.";

        } else if (
          errorCode ===
          "auth/network-request-failed"
        ) {

          friendlyMessage =
            "Network error. Check your internet connection.";

        } else if (
          errorCode ===
          "auth/too-many-requests"
        ) {

          friendlyMessage =
            "Firebase temporarily blocked too many requests. Try again later.";

        }


        showMessage(
          friendlyMessage,
          "error"
        );


        showDebug(
          "FIREBASE REGISTRATION ERROR\n\n" +
          "Code:\n" +
          errorCode +
          "\n\n" +
          "Message:\n" +
          errorMessage
        );


        registerBtn.disabled = false;

        registerBtn.textContent =
          "Create Account";

      }

    });

  </script>

</body>
</html>
