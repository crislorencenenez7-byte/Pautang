<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | PautangMo</title><link rel="stylesheet" href="style.css"></head><body><main class="auth-shell"><section class="auth-card"><a class="brand" href="index.html">₱ PautangMo</a><p class="eyebrow">CREATE ACCOUNT</p><h1>Join PautangMo</h1><p>Create your client account. Every new registration starts as a client.</p><form id="registerForm"><label>Full Name<input id="name" type="text" autocomplete="name" required placeholder="Your full name"></label><label>Email<input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></label><label>Password<input id="password" type="password" autocomplete="new-password" minlength="6" required placeholder="At least 6 characters"></label><label>Confirm Password<input id="confirmPassword" type="password" autocomplete="new-password" minlength="6" required placeholder="Repeat password"></label><button class="primary-btn" id="registerButton" type="submit">Create account →</button><div id="message" class="message" hidden></div></form><a href="login.html">Already have an account? Sign in →</a><br><a href="index.html">← Back to website</a></section></main><script src="firebase-config.js"></script><script type="module">import {auth,db,createUserWithEmailAndPassword,sendEmailVerification,updateProfile} from "./auth.js";import {doc,setDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";const form=document.getElementById("registerForm"),msg=document.getElementById("message"),btn=document.getElementById("registerButton");form.addEventListener("submit",async e=>{e.preventDefault();msg.hidden=true;const name=document.getElementById("name").value.trim(),email=document.getElementById("email").value.trim(),password=document.getElementById("password").value,confirm=document.getElementById("confirmPassword").value;if(!name)return show("Please enter your full name.");if(password!==confirm)return show("Passwords do not match.");if(password.length<6)return show("Password must be at least 6 characters.");btn.disabled=true;btn.textContent="Creating account...";try{const c=await createUserWithEmailAndPassword(auth,email,password);const user=c.user;await updateProfile(user,{displayName:name});await setDoc(doc(db,"users",user.uid),{name,email:user.email,role:"client",createdAt:serverTimestamp()});await sendEmailVerification(user);show("Account created! Check your email and verify your account.");form.reset();}catch(err){console.error(err);show(err.code==="auth/email-already-in-use"?"This email is already registered.":err.code==="auth/invalid-email"?"Invalid email address.":err.code==="auth/weak-password"?"Password must be at least 6 characters.":err.code==="permission-denied"?"Firestore permission denied. Publish the Firestore rules.":(err.message||"Registration failed."),true);}finally{btn.disabled=false;btn.textContent="Create account →";}});function show(text,error=false){msg.textContent=text;msg.className=error?"message error":"message";msg.hidden=false;}</script></body></html>
