<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1f16">
  <title>Sign in | PautangMo</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>

  <main class="auth-shell">
    <section class="auth-card auth-card-wide">

      <div class="auth-brand-row">
        <a class="brand brand-mark" href="index.html">
          <span>₱</span> PautangMo
        </a>

        <span class="secure-pill">● Secure</span>
      </div>

      <div class="auth-grid login-grid">

        <!-- LEFT SIDE -->
        <div class="auth-copy auth-copy-login">

          <p class="eyebrow">WELCOME BACK</p>

          <h1>
            Your account.<br>
            <span>Your next step.</span>
          </h1>

          <p class="auth-lead">
            Sign in securely to continue to your PautangMo dashboard
            and loan application.
          </p>

          <div class="login-orbit" aria-hidden="true">
            <div class="orbit-core">₱</div>

            <span class="orbit-dot dot-a">✓</span>
            <span class="orbit-dot dot-b">↗</span>
            <span class="orbit-dot dot-c">•</span>
          </div>

        </div>

        <!-- LOGIN FORM -->
        <div class="auth-form-panel">

          <div class="form-heading">
            <h2>Sign in</h2>

            <p>
              Use your verified email and password.
            </p>
          </div>

          <form id="loginForm" novalidate>

            <label>
              Email

              <input
                id="email"
                type="email"
                autocomplete="email"
                required
                placeholder="you@example.com"
              >
            </label>

            <label>
              Password

              <input
                id="password"
                type="password"
                autocomplete="current-password"
                required
                placeholder="Your password"
              >
            </label>

            <button
              class="primary-btn auth-submit"
              id="loginButton"
              type="submit"
            >
              <span>Sign In</span>
              <b>→</b>
            </button>

            <div
              id="message"
              class="message"
              hidden
            ></div>

          </form>

          <div class="auth-switch-card">
            <span>New to PautangMo?</span>

            <a
              class="secondary-auth-btn"
              href="register.html"
            >
              Create account <b>→</b>
            </a>
          </div>

          <a
            class="back-link"
            href="index.html"
          >
            ← Back to PautangMo
          </a>

        </div>

      </div>

    </section>
  </main>

  <script src="firebase-config.js"></script>

  <script type="module">

    import {
      auth,
      signInWithEmailAndPassword,
      signOut,
      getIdToken
    } from "./auth.js";


    const form = document.getElementById("loginForm");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const message =
      document.getElementById("message");

    const loginButton =
      document.getElementById("loginButton");


    const next =
      new URLSearchParams(location.search)
        .get("next") || "apply.html";


    function showMessage(
      text,
      type = "success"
    ) {

      message.textContent = text;

      message.className =
        `message ${type}`;

      message.hidden = false;
    }


    function withTimeout(
      promise,
      ms,
      label
    ) {

      return Promise.race([

        promise,

        new Promise((_, reject) => {

          setTimeout(() => {

            reject(
              new Error(label)
            );

          }, ms);

        })

      ]);

    }


    form.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        message.hidden = true;

        loginButton.disabled = true;

        loginButton.classList.add(
          "is-loading"
        );

        loginButton.innerHTML =
          '<span>Signing in</span><i class="spinner"></i>';


        try {

          /*
           * FIREBASE LOGIN
           */
          const credential =
            await withTimeout(

              signInWithEmailAndPassword(
                auth,
                emailInput.value
                  .trim()
                  .toLowerCase(),
                passwordInput.value
              ),

              15000,

              "Sign-in timed out. Check your internet connection and Firebase configuration."

            );


          const user =
            credential.user;


          /*
           * EMAIL VERIFICATION CHECK
           */
          if (!user.emailVerified) {

            await signOut(auth);

            showMessage(

              "Please verify the link sent to your email first, then come back and Sign In.",

              "error"

            );

            return;
          }


          /*
           * SYNC USER PROFILE
           *
           * This is optional.
           * If the API fails, login will still continue.
           */
          try {

            const token =
              await getIdToken(
                user,
                true
              );


            const controller =
              new AbortController();


            const timer =
              setTimeout(() => {

                controller.abort();

              }, 7000);


            try {

              await fetch(
                "/api/user-profile",
                {
                  method: "POST",

                  headers: {
                    "Content-Type":
                      "application/json",

                    "Authorization":
                      `Bearer ${token}`
                  },

                  body: JSON.stringify({

                    name:
                      user.displayName ||
                      "PautangMo Client",

                    email:
                      user.email

                  }),

                  signal:
                    controller.signal
                }
              );

            } finally {

              clearTimeout(timer);

            }

          } catch (profileError) {

            console.warn(
              "Profile sync skipped:",
              profileError
            );

          }


          /*
           * LOGIN SUCCESS
           *
           * Resend/login notification
           * has intentionally been removed.
           *
           * No /api/login-notify request.
           */
          location.href = next;


        } catch (error) {

          console.error(
            "Login error:",
            error
          );


          const errorMessage =

            error.code ===
            "auth/invalid-credential"

              ? "Incorrect email or password."

            : error.code ===
              "auth/user-not-found"

              ? "No account was found for this email."

            : error.code ===
              "auth/wrong-password"

              ? "Incorrect password."

            : error.code ===
              "auth/too-many-requests"

              ? "Too many attempts. Please wait and try again."

            : error.message ||
              "Unable to sign in.";


          showMessage(
            errorMessage,
            "error"
          );


        } finally {

          loginButton.disabled =
            false;

          loginButton.classList.remove(
            "is-loading"
          );

          loginButton.innerHTML =
            "<span>Sign In</span><b>→</b>";

        }

      }
    );

  </script>

  <script src="ui.js"></script>

</body>
</html>
