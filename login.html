<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sign In - PautangMo</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .auth-container {
      max-width: 450px;
      margin: 40px auto;
      padding: 25px;
    }

    .auth-card {
      background: #fff;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .auth-card h1 {
      margin-bottom: 8px;
    }

    .auth-card > p {
      color: #666;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .form-group input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    .form-group input:focus {
      border-color: #2563eb;
    }

    .signin-btn,
    .resend-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .signin-btn {
      background: #2563eb;
      color: white;
    }

    .resend-btn {
      margin-top: 10px;
      background: #e5e7eb;
      color: #111827;
    }

    .signin-btn:disabled,
    .resend-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .forgot {
      display: block;
      margin: 12px 0;
      text-align: right;
      color: #2563eb;
      text-decoration: none;
      font-size: 14px;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.success {
      display: block;
      background: #e8f7ee;
      color: #166534;
    }

    .message.error {
      display: block;
      background: #feecec;
      color: #991b1b;
    }

    .debug-box {
      display: none;
      margin-top: 15px;
      padding: 12px;
      background: #111827;
      color: #f9fafb;
      border-radius: 10px;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .register-link {
      text-align: center;
      margin-top: 18px;
    }

    .register-link a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>

<body>

  <div class="auth-container">

    <div class="auth-card">

      <h1>Sign In</h1>

      <p>
        Sign in to your PautangMo account.
      </p>

      <form id="loginForm">

        <div class="form-group">
          <label for="email">Email Address</label>

          <input
            type="email"
            id="email"
            placeholder="you@example.com"
            required
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>

          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
            autocomplete="current-password"
          >
        </div>

        <a href="#" id="forgotPassword" class="forgot">
          Forgot Password?
        </a>

        <button
          type="submit"
          id="loginBtn"
          class="signin-btn"
        >
          Sign In
        </button>

      </form>

      <button
        type="button"
        id="resendBtn"
        class="resend-btn"
        style="display:none;"
      >
        Resend Verification Email
      </button>

      <div id="message" class="message"></div>

      <div id="debugBox" class="debug-box"></div>

      <div class="register-link">
        Don't have an account?
        <a href="register.html">Create Account</a>
      </div>

    </div>

  </div>


  <script type="module">

    import {
      signInWithEmailAndPassword,
      sendEmailVerification,
      sendPasswordResetEmail,
      signOut
    } from "./auth.js";


    const loginForm =
      document.getElementById("loginForm");

    const loginBtn =
      document.getElementById("loginBtn");

    const resendBtn =
      document.getElementById("resendBtn");

    const forgotPassword =
      document.getElementById("forgotPassword");

    const message =
      document.getElementById("message");

    const debugBox =
      document.getElementById("debugBox");


    let currentUser = null;


    function showMessage(text, type) {

      message.textContent = text;

      message.className =
        "message " + type;
    }


    function showDebug(text) {

      debugBox.textContent = text;

      debugBox.style.display = "block";
    }


    function hideDebug() {

      debugBox.textContent = "";

      debugBox.style.display = "none";
    }


    function withTimeout(
      promise,
      milliseconds,
      timeoutMessage
    ) {

      const timeout = new Promise((_, reject) => {

        setTimeout(() => {

          reject(
            new Error(timeoutMessage)
          );

        }, milliseconds);

      });

      return Promise.race([
        promise,
        timeout
      ]);
    }


    /*
     * SIGN IN
     */

    loginForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        hideDebug();

        const email =
          document
            .getElementById("email")
            .value
            .trim();

        const password =
          document
            .getElementById("password")
            .value;


        loginBtn.disabled = true;

        loginBtn.textContent =
          "Signing In...";


        resendBtn.style.display =
          "none";


        try {

          const credential =
            await signInWithEmailAndPassword(
              email,
              password
            );


          currentUser =
            credential.user;


          /*
           * CHECK EMAIL VERIFICATION
           */

          if (!currentUser.emailVerified) {

            showMessage(
              "Your email address is not verified yet.\n\n" +
              "Please check your Inbox or Spam/Junk folder.",
              "error"
            );


            resendBtn.style.display =
              "block";


            loginBtn.disabled =
              false;

            loginBtn.textContent =
              "Sign In";


            return;
          }


          /*
           * VERIFIED
           */

          showMessage(
            "Login successful. Redirecting...",
            "success"
          );


          /*
           * Go to homepage.
           */

          setTimeout(() => {

            window.location.href =
              "index.html";

          }, 500);


        } catch (error) {

          console.error(
            "LOGIN ERROR:",
            error
          );


          const errorCode =
            error?.code ||
            "unknown";

          const errorMessage =
            error?.message ||
            error?.toString() ||
            "Unknown Firebase error";


          let friendlyMessage =
            "Unable to sign in.";


          if (
            errorCode ===
            "auth/invalid-credential"
          ) {

            friendlyMessage =
              "Incorrect email or password.";

          } else if (
            errorCode ===
            "auth/invalid-email"
          ) {

            friendlyMessage =
              "Please enter a valid email address.";

          } else if (
            errorCode ===
            "auth/user-not-found"
          ) {

            friendlyMessage =
              "No account was found with this email.";

          } else if (
            errorCode ===
            "auth/wrong-password"
          ) {

            friendlyMessage =
              "Incorrect password.";

          } else if (
            errorCode ===
            "auth/too-many-requests"
          ) {

            friendlyMessage =
              "Too many attempts. Please try again later.";

          } else if (
            errorCode ===
            "auth/network-request-failed"
          ) {

            friendlyMessage =
              "Network error. Check your internet connection.";

          }


          showMessage(
            friendlyMessage,
            "error"
          );


          showDebug(
            "FIREBASE LOGIN ERROR\n\n" +
            "Code:\n" +
            errorCode +
            "\n\n" +
            "Message:\n" +
            errorMessage
          );


          loginBtn.disabled =
            false;

          loginBtn.textContent =
            "Sign In";
        }

      }
    );


    /*
     * RESEND VERIFICATION
     */

    resendBtn.addEventListener(
      "click",
      async () => {

        if (!currentUser) {

          showMessage(
            "Please sign in first.",
            "error"
          );

          return;
        }


        resendBtn.disabled =
          true;

        resendBtn.textContent =
          "Sending...";

        hideDebug();


        try {

          await withTimeout(
            sendEmailVerification(
              currentUser
            ),
            15000,
            "Firebase verification email request timed out."
          );


          showMessage(
            "Verification email sent successfully.\n\n" +
            "Check your Inbox and Spam/Junk folder.",
            "success"
          );


          resendBtn.textContent =
            "Verification Email Sent";


        } catch (error) {

          console.error(
            "VERIFICATION RESEND ERROR:",
            error
          );


          const errorCode =
            error?.code ||
            "unknown";

          const errorMessage =
            error?.message ||
            error?.toString() ||
            "Unknown Firebase error";


          showMessage(
            "Firebase could not send the verification email.",
            "error"
          );


          showDebug(
            "FIREBASE VERIFICATION ERROR\n\n" +
            "Code:\n" +
            errorCode +
            "\n\n" +
            "Message:\n" +
            errorMessage
          );


          resendBtn.disabled =
            false;

          resendBtn.textContent =
            "Resend Verification Email";
        }

      }
    );


    /*
     * FORGOT PASSWORD
     */

    forgotPassword.addEventListener(
      "click",
      async (event) => {

        event.preventDefault();

        hideDebug();


        const email =
          document
            .getElementById("email")
            .value
            .trim();


        if (!email) {

          showMessage(
            "Enter your email address first.",
            "error"
          );

          return;
        }


        try {

          await withTimeout(
            sendPasswordResetEmail(email),
            15000,
            "Password reset request timed out."
          );


          showMessage(
            "Password reset email sent.\n\n" +
            "Check your Inbox and Spam/Junk folder.",
            "success"
          );


        } catch (error) {

          console.error(
            "PASSWORD RESET ERROR:",
            error
          );


          const errorCode =
            error?.code ||
            "unknown";

          const errorMessage =
            error?.message ||
            error?.toString() ||
            "Unknown Firebase error";


          showMessage(
            "Unable to send password reset email.",
            "error"
          );


          showDebug(
            "FIREBASE PASSWORD RESET ERROR\n\n" +
            "Code:\n" +
            errorCode +
            "\n\n" +
            "Message:\n" +
            errorMessage
          );

        }

      }
    );

  </script>

</body>
</html>
