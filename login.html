<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login - PautangMo</title>

  <link rel="stylesheet" href="style.css">

  <script src="firebase-config.js"></script>

</head>


<body>


  <!-- NAVIGATION -->

  <header>

    <nav>

      <a href="index.html">
        Home
      </a>

      <a href="apply.html">
        Apply Loan
      </a>

      <a href="pay.html">
        Pay Loan
      </a>

      <a href="login.html">
        Login
      </a>

      <a href="register.html">
        Register
      </a>

      <a href="admin-login.html">
        Admin
      </a>

    </nav>

  </header>



  <!-- LOGIN -->

  <main class="auth-container">

    <div class="auth-box">

      <h1>
        Login
      </h1>

      <p>
        Login to your PautangMo account.
      </p>


      <form id="loginForm">


        <label for="email">
          Email Address
        </label>

        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >


        <label for="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >


        <button
          type="submit"
          id="loginButton"
        >
          Login
        </button>


      </form>


      <p
        id="message"
        class="form-message"
      ></p>


      <p class="auth-switch">

        Don't have an account?

        <a href="register.html">
          Register
        </a>

      </p>


    </div>

  </main>



  <!-- LOGIN SCRIPT -->

  <script type="module">

    import {
      auth,
      signInWithEmailAndPassword,
      signOut
    } from "./auth.js";


    const form =
      document.getElementById("loginForm");


    const message =
      document.getElementById("message");


    const button =
      document.getElementById("loginButton");



    const params =
      new URLSearchParams(
        window.location.search
      );


    const next =
      params.get("next") ||
      "apply.html";



    form.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();


        const email =
          document
            .getElementById("email")
            .value
            .trim();


        const password =
          document
            .getElementById("password")
            .value;


        try {

          button.disabled = true;

          button.textContent =
            "Logging in...";


          const credential =
            await signInWithEmailAndPassword(
              auth,
              email,
              password
            );


          const user =
            credential.user;



          /*
           * EMAIL MUST BE VERIFIED
           */

          if (!user.emailVerified) {

            await signOut(auth);


            message.textContent =
              "Please verify your email first. " +
              "Check your inbox.";

            return;
          }



          /*
           * SUCCESS
           */

          window.location.href =
            next;


        } catch (error) {

          console.error(
            "Login error:",
            error
          );


          if (
            error.code ===
            "auth/invalid-credential"
          ) {

            message.textContent =
              "Incorrect email or password.";


          } else if (
            error.code ===
            "auth/user-not-found"
          ) {

            message.textContent =
              "Account not found.";


          } else if (
            error.code ===
            "auth/wrong-password"
          ) {

            message.textContent =
              "Incorrect password.";


          } else {

            message.textContent =
              error.message ||
              "Login failed.";

          }


        } finally {

          button.disabled = false;

          button.textContent =
            "Login";

        }

      }

    );

  </script>


</body>

</html>
