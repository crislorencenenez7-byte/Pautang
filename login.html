<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >
  <title>Login | PautangMo</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="auth-shell">
    <section class="auth-card">
      <a class="brand" href="index.html">₱ PautangMo</a>

      <p class="eyebrow">CLIENT ACCESS</p>

      <h1>Sign in to PautangMo</h1>

      <p>
        Login to your account to continue to your loan application.
      </p>

      <form id="loginForm">
        <label for="email">
          Email
          <input
            id="email"
            type="email"
            autocomplete="email"
            required
            placeholder="you@example.com"
          >
        </label>

        <label for="password">
          Password
          <input
            id="password"
            type="password"
            autocomplete="current-password"
            required
            placeholder="Password"
          >
        </label>

        <button
          class="primary-btn"
          id="loginButton"
          type="submit"
        >
          Sign in →
        </button>

        <div
          id="message"
          class="message"
          hidden
        ></div>

        <button
          class="secondary-btn"
          id="resendButton"
          type="button"
          hidden
          style="width:100%;margin-top:10px;"
        >
          Resend verification email
        </button>
      </form>

      <a href="register.html">
        Create a new account →
      </a>

      <br>

      <a href="index.html">
        ← Back to website
      </a>
    </section>
  </main>

  <script src="firebase-config.js"></script>

  <script type="module">
    import {
      auth,
      signInWithEmailAndPassword,
      sendEmailVerification,
      signOut
    } from "./auth.js";

    const form = document.getElementById("loginForm");
    const msg = document.getElementById("message");
    const btn = document.getElementById("loginButton");
    const resendButton = document.getElementById("resendButton");

    const next =
      new URLSearchParams(location.search).get("next") ||
      "apply.html";

    let unverifiedUser = null;

    function showMessage(text, error = false) {
      msg.textContent = text;
      msg.className = error
        ? "message error"
        : "message";
      msg.hidden = false;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      msg.hidden = true;
      resendButton.hidden = true;
      unverifiedUser = null;

      btn.disabled = true;
      btn.textContent = "Signing in...";

      try {
        const email =
          document.getElementById("email").value.trim();

        const password =
          document.getElementById("password").value;

        const credential =
          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );

        const user = credential.user;

        if (!user.emailVerified) {
          unverifiedUser = user;

          showMessage(
            "Your email is not verified yet. " +
            "Check your inbox or resend the verification email.",
            true
          );

          resendButton.hidden = false;

          await signOut(auth);

          return;
        }

        window.location.href = next;

      } catch (error) {
        console.error("Login error:", error);

        let text = "Login failed.";

        if (error.code === "auth/invalid-credential") {
          text = "Incorrect email or password.";
        } else if (error.code === "auth/user-not-found") {
          text = "Account not found.";
        } else if (error.code === "auth/wrong-password") {
          text = "Incorrect password.";
        } else if (error.code === "auth/too-many-requests") {
          text =
            "Too many login attempts. Please try again later.";
        } else if (error.message) {
          text = error.message;
        }

        showMessage(text, true);

      } finally {
        btn.disabled = false;
        btn.textContent = "Sign in →";
      }
    });

    resendButton.addEventListener("click", async () => {
      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      resendButton.disabled = true;
      resendButton.textContent = "Sending...";

      try {
        /*
         * Firebase only sends verification emails when requested.
         * A normal successful login does NOT automatically send an email.
         */

        if (!unverifiedUser) {
          const credential =
            await signInWithEmailAndPassword(
              auth,
              email,
              password
            );

          unverifiedUser = credential.user;
        }

        await sendEmailVerification(unverifiedUser);

        showMessage(
          "Verification email sent. Please check your inbox."
        );

        await signOut(auth);

      } catch (error) {
        console.error(
          "Resend verification error:",
          error
        );

        showMessage(
          error.message ||
            "Unable to send the verification email.",
          true
        );

      } finally {
        resendButton.disabled = false;
        resendButton.textContent =
          "Resend verification email";
      }
    });
  </script>
</body>
</html>
