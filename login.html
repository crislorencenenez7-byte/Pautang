<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d0d0d">
  <title>Login | PautangMo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-card { max-width: 480px; }
    .auth-card form { display: grid; gap: 14px; margin-top: 22px; }
    .auth-card label { display: grid; gap: 7px; font-weight: 600; }
    .auth-card input { width: 100%; box-sizing: border-box; }
    .auth-status { min-height: 22px; margin-top: 4px; }
    .primary-btn:disabled { opacity: .65; cursor: wait; }
    .secondary-btn { width: 100%; margin-top: 8px; }
  </style>
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card">
      <a class="brand" href="index.html">₱ PautangMo</a>
      <p class="eyebrow">CLIENT ACCESS</p>
      <h1>Welcome back.</h1>
            <p class="auth-note">Secure account access powered by Firebase.</p>
      <p>Sign in to continue to your PautangMo account.</p>

      <form id="loginForm" novalidate>
        <label for="email">Email
          <input id="email" type="email" autocomplete="email" required placeholder="you@example.com">
        </label>

        <label for="password">Password
          <input id="password" type="password" autocomplete="current-password" required placeholder="Your password">
        </label>

        <button class="primary-btn" id="loginButton" type="submit">Sign in →</button>
        <button class="primary-btn secondary-btn" id="resendButton" type="button" hidden>Resend verification email</button>
        <div id="message" class="message auth-status" hidden></div>
      </form>

      <p><a href="register.html">Create a new account →</a></p>
      <a href="index.html">← Back to website</a>
    </section>
  </main>

  <script src="firebase-config.js"></script>
  <script type="module">
    import {
      auth,
      signInWithEmailAndPassword,
      sendEmailVerification,
      signOut
    } from "./auth.js";

    const form = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const message = document.getElementById("message");
    const loginButton = document.getElementById("loginButton");
    const resendButton = document.getElementById("resendButton");
    const next = new URLSearchParams(location.search).get("next") || "apply.html";
    let unverifiedUser = null;

    function showMessage(text, isError = false) {
      message.textContent = text;
      message.className = isError ? "message error auth-status" : "message auth-status";
      message.hidden = false;
    }

    function withTimeout(promise, ms, messageText) {
      return Promise.race([
        promise,
        new Promise((_, reject) => {
          setTimeout(() => reject(new Error(messageText)), ms);
        })
      ]);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.hidden = true;
      resendButton.hidden = true;
      unverifiedUser = null;
      loginButton.disabled = true;
      loginButton.textContent = "Signing in…";

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        showMessage("Enter your email and password.", true);
        loginButton.disabled = false;
        loginButton.textContent = "Sign in →";
        return;
      }

      try {
        const credential = await withTimeout(
          signInWithEmailAndPassword(auth, email, password),
          15000,
          "Firebase took too long to respond. Check your internet connection and try again."
        );

        const user = credential.user;

        if (!user.emailVerified) {
          unverifiedUser = user;
          await signOut(auth);
          showMessage("Please verify your email before logging in.", true);
          resendButton.hidden = false;
          return;
        }

        showMessage("Login successful. Redirecting…");

        // Do not block login on the optional notification email.
        fetch("/api/login-notify", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: user.email,
            name: user.displayName || "PautangMo Client"
          })
        }).catch((error) => console.warn("Login notification failed:", error));

        setTimeout(() => {
          location.href = next;
        }, 250);
      } catch (error) {
        console.error("Login error:", error);

        const code = error.code || "";
        const errorMessage =
          code === "auth/invalid-credential" ? "Incorrect email or password." :
          code === "auth/invalid-email" ? "Please enter a valid email address." :
          code === "auth/too-many-requests" ? "Too many attempts. Please wait and try again." :
          error.message || "Login failed.";

        showMessage(errorMessage, true);
      } finally {
        loginButton.disabled = false;
        loginButton.textContent = "Sign in →";
      }
    });

    resendButton.addEventListener("click", async () => {
      if (!unverifiedUser) return;
      resendButton.disabled = true;
      resendButton.textContent = "Sending…";

      try {
        await withTimeout(
          sendEmailVerification(unverifiedUser),
          15000,
          "The verification request timed out. Please try again."
        );
        showMessage("Verification email sent. Check your inbox.");
      } catch (error) {
        console.error(error);
        showMessage(
          error.code === "auth/too-many-requests"
            ? "Please wait before requesting another verification email."
            : error.message || "Unable to send verification email.",
          true
        );
      } finally {
        resendButton.disabled = false;
        resendButton.textContent = "Resend verification email";
      }
    });
  </script>
</body>
</html>
