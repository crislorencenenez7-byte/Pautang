<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | PautangMo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card">
      <a class="brand" href="index.html">₱ PautangMo</a>
      <p class="eyebrow">CLIENT ACCESS</p>
      <h1>Sign in to PautangMo</h1>
      <p>Login to your account to continue to your loan application.</p>

      <form id="loginForm">
        <label>
          Email
          <input id="email" type="email" autocomplete="email" required placeholder="you@example.com">
        </label>

        <label>
          Password
          <input id="password" type="password" autocomplete="current-password" required placeholder="Password">
        </label>

        <button class="primary-btn" id="loginButton" type="submit">Sign in →</button>
        <button class="primary-btn" id="resendButton" type="button" hidden>Resend verification email</button>

        <div id="message" class="message" hidden></div>
      </form>

      <a href="register.html">Create a new account →</a><br>
      <a href="index.html">← Back to website</a>
    </section>
  </main>

  <script src="firebase-config.js"></script>
  <script type="module">
    import {
      auth,
      signInWithEmailAndPassword,
      sendEmailVerification,
      signOut
    } from "./auth.js";

    const form = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const message = document.getElementById("message");
    const loginButton = document.getElementById("loginButton");
    const resendButton = document.getElementById("resendButton");

    const next = new URLSearchParams(location.search).get("next") || "apply.html";
    let unverifiedUser = null;

    function showMessage(text, isError = false) {
      message.textContent = text;
      message.className = isError ? "message error" : "message";
      message.hidden = false;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.hidden = true;
      resendButton.hidden = true;
      unverifiedUser = null;
      loginButton.disabled = true;
      loginButton.textContent = "Signing in...";

      try {
        const credential = await signInWithEmailAndPassword(
          auth,
          emailInput.value.trim(),
          passwordInput.value
        );

        const user = credential.user;

        // A verified account is NOT sent another verification email.
        if (!user.emailVerified) {
          unverifiedUser = user;
          await signOut(auth);
          showMessage("Please verify your email before logging in.", true);
          resendButton.hidden = false;
          return;
        }

        // Send the login notification through the server only.
        // The email-service API key must never be placed in this HTML file.
        try {
          await fetch("/api/login-notify", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              email: user.email,
              name: user.displayName || "PautangMo Client"
            })
          });
        } catch (notifyError) {
          console.warn("Login notification could not be sent:", notifyError);
        }

        location.href = next;
      } catch (error) {
        console.error(error);

        const errorMessage =
          error.code === "auth/invalid-credential"
            ? "Incorrect email or password."
            : error.code === "auth/too-many-requests"
              ? "Too many attempts. Please wait and try again."
              : error.message || "Login failed.";

        showMessage(errorMessage, true);
      } finally {
        loginButton.disabled = false;
        loginButton.textContent = "Sign in →";
      }
    });

    resendButton.addEventListener("click", async () => {
      if (!unverifiedUser) {
        showMessage("Please sign in first with an unverified account.", true);
        return;
      }

      resendButton.disabled = true;
      resendButton.textContent = "Sending...";

      try {
        await sendEmailVerification(unverifiedUser);
        showMessage("Verification email sent. Check your inbox.");
      } catch (error) {
        console.error(error);
        showMessage(
          error.code === "auth/too-many-requests"
            ? "Please wait before requesting another verification email."
            : error.message || "Unable to send verification email.",
          true
        );
      } finally {
        resendButton.disabled = false;
        resendButton.textContent = "Resend verification email";
      }
    });
  </script>
</body>
</html>
