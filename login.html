<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | PautangMo</title><link rel="stylesheet" href="style.css"></head><body><main class="auth-shell"><section class="auth-card"><a class="brand" href="index.html">₱ PautangMo</a><p class="eyebrow">CLIENT ACCESS</p><h1>Sign in to PautangMo</h1><p>Login to your account to continue to your loan application.</p><form id="loginForm"><label>Email<input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></label><label>Password<input id="password" type="password" autocomplete="current-password" required placeholder="Password"></label><button class="primary-btn" id="loginButton" type="submit">Sign in →</button><div id="message" class="message" hidden></div></form><a href="register.html">Create a new account →</a><br><a href="index.html">← Back to website</a></section></main><script src="firebase-config.js"></script><script type="module">import {auth,signInWithEmailAndPassword,signOut} from "./auth.js";const form=document.getElementById("loginForm"),msg=document.getElementById("message"),btn=document.getElementById("loginButton");const next=new URLSearchParams(location.search).get("next")||"apply.html";form.addEventListener("submit",async e=>{e.preventDefault();msg.hidden=true;btn.disabled=true;btn.textContent="Signing in...";try{const c=await signInWithEmailAndPassword(auth,document.getElementById("email").value.trim(),document.getElementById("password").value);if(!c.user.emailVerified){await signOut(auth);throw new Error("Please verify your email before logging in.");}location.href=next;}catch(err){msg.textContent=err.code==="auth/invalid-credential"?"Incorrect email or password.":(err.message||"Login failed.");msg.className="message error";msg.hidden=false;}finally{btn.disabled=false;btn.textContent="Sign in →";}});</script></body></html>
