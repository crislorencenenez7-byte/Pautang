<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login | PautangMo</title><link rel="stylesheet" href="style.css"><script src="firebase-config.js"></script></head>
<body><main class="auth-shell"><section class="auth-card">
<a class="brand" href="index.html">₱ PautangMo</a><p class="eyebrow">BORROWER ACCOUNT</p><h1>Welcome back.</h1><p>Sign in to manage your loan and payment information.</p>
<form id="loginForm"><label>Email<input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></label><label>Password<input id="password" type="password" autocomplete="current-password" required placeholder="Your password"></label><button class="primary-btn" type="submit">Login →</button><div id="message" class="message" hidden></div></form>
<p class="auth-switch">No account yet? <a href="register.html">Register</a></p><a href="index.html">← Back to website</a>
</section></main>
<script type="module">import {auth,signInWithEmailAndPassword} from './auth.js';
const form=document.getElementById('loginForm'),msg=document.getElementById('message');
form.addEventListener('submit',async e=>{e.preventDefault();msg.hidden=true;try{const c=await signInWithEmailAndPassword(auth,document.getElementById('email').value.trim(),document.getElementById('password').value);if(!c.user.emailVerified){msg.textContent='Please verify your email before continuing.';msg.className='message error';msg.hidden=false;return;}location.href='apply.html';}catch(err){msg.textContent='Invalid email or password.';msg.className='message error';msg.hidden=false;}});</script></body></html>
